[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinthac"
version = "0.1.0"
description = "Physics Informed Nuclear Thermal-Hydraulics Analysis Code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Elliott Hirko", email = "elliott.hirko@ufl.edu" }]
keywords = ["thermal-hydraulics", "nuclear", "IAPWS", "supercritical-water", "deeponet"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
benchmark = ["iapws>=1.5"]
ml = ["pytorch_optimizer>=3.0"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["pinthac*", "torchsolve"]

[tool.setuptools.package-data]
"pinthac.properties" = ["iapws_data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Range violations are warnings by design (see pinthac/ranges.py), but a test that
    # trips one is almost always a test with the wrong inputs, so make them fatal here.
    "error::pinthac.ranges.RangeWarning",
]
